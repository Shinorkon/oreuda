name: 🚀 Oreuda Deploy

on:
  push:
    branches: [main, staging]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd /root/oreuda
            git fetch origin
            git reset --hard origin/main
            
            # Use persistent password file
            ENV_FILE="/root/.oreuda_env"
            if [ -f "$ENV_FILE" ]; then
              source "$ENV_FILE"
            else
              DB_PASSWORD=$(openssl rand -hex 16)
              SECRET_KEY=$(openssl rand -hex 32)
              echo "DB_PASSWORD=${DB_PASSWORD}" > "$ENV_FILE"
              echo "SECRET_KEY=${SECRET_KEY}" >> "$ENV_FILE"
            fi
            
            cat > backend/.env << EOF
            DATABASE_URL=postgresql://oreuda:${DB_PASSWORD}@db:5432/oreuda
            SECRET_KEY=${SECRET_KEY}
            ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_DAYS=30
            DEBUG=False
            EOF
            
            # Export for docker-compose
            export DB_PASSWORD
            export SECRET_KEY
            
            # Stop services (keep volume for data persistence)
            docker compose down
            docker compose up -d --build
            sleep 10
            docker compose exec -T backend alembic upgrade head || true
            docker compose ps
            echo "✅ Backend deployed at http://${{ secrets.VPS_HOST }}:8004"
