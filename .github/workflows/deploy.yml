name: 🚀 Oreuda Deploy + Build APK

on:
  push:
    branches: [main, staging]

jobs:
  deploy:
    name: Deploy Backend & Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Contabo VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          debug: true
          script: |
            echo "SSH connected successfully"
            whoami
            hostname

      - name: Trigger APK Build on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            echo "APK build step"

      - name: Fetch APK via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          source: "/root/oreuda/builds/latest/oreuda-release.apk"
          target: "./oreuda-release.apk"

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oreuda-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: "./oreuda-release.apk"
          retention-days: 30
